<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Stream</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/stream.css"></link>
</head>

<body class="min-h-screen flex flex-col safe-top">

    <!-- ══════════════════════════════════
         HEADER — matches index.html exactly
         but icon = video camera, title = streamer
    ══════════════════════════════════ -->
    <header class="w-full px-5 py-4 flex justify-between items-center"
            style="border-bottom: 1px solid rgba(255,255,255,0.05)">

        <!-- left: logo -->
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-video text-2xl" style="color: var(--main)"></i>
            <h1 class="text-xl font-bold">stream</h1>
        </div>

        <!-- right: connection status -->
        <div class="flex items-center gap-2 text-sm" style="color: var(--sub)">
            <div id="status-dot" class="status-indicator status-red"></div>
            <span id="status-text" style="font-size: 0.75rem">disconnected</span>
        </div>
    </header>

    <!-- ══════════════════════════════════
         SCREEN: CONNECTING TO SERVER
         Shown immediately on load while WS opens
    ══════════════════════════════════ -->
    <div id="connecting-screen" class="screen active flex-1 items-center justify-center text-center p-8">
        <div>
            <div class="inline-block p-4 rounded-full mb-5"
                 style="background: rgba(226,183,20,0.1)">
                <i class="fa-solid fa-circle-notch text-4xl spin" style="color: var(--main)"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">Se conectează...</h2>
            <p class="text-sm" style="color: var(--sub)">Se stabilește conexiunea cu serverul</p>
        </div>
    </div>

    <!-- ══════════════════════════════════
         SCREEN: AUTH
         Only shown after WS is open.
         Camera / stream panel NOT accessible until
         server responds with STREAM_AUTH_OK.
    ══════════════════════════════════ -->
    <div id="auth-screen" class="screen flex-1 items-center justify-center p-6">
        <div class="w-full" style="max-width: 380px">

            <!-- icon + heading -->
            <div class="text-center mb-8">
                <div class="inline-block p-4 rounded-full mb-4"
                     style="background: rgba(226,183,20,0.1)">
                    <i class="fa-solid fa-lock text-3xl" style="color: var(--main)"></i>
                </div>
                <h2 class="text-2xl font-bold mb-1">Acces Cameră</h2>
                <p class="text-sm" style="color: var(--sub)">Introdu cheia de acces pentru stream</p>
            </div>

            <!-- key input -->
            <div class="mb-5">
                <label class="field-label" for="stream-key">cheie de acces</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-key" style="color: var(--sub)"></i>
                    </div>
                    <input
                        type="password"
                        id="stream-key"
                        class="field-input"
                        style="padding-left: 3rem; text-align: left; letter-spacing: 0.15em"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        onkeydown="if(event.key==='Enter') submitAuth()">
                </div>
                <p id="auth-error" class="text-xs mt-2" style="color:var(--error);display:none;letter-spacing:0.05em">
                    Cheie incorectă. Încearcă din nou.
                </p>
            </div>

            <button class="btn btn-primary btn-w" onclick="submitAuth()" id="auth-btn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
                Conectare
            </button>

            <!-- waiting for server response indicator (hidden until key is sent) -->
            <div id="auth-waiting" class="text-center mt-4" style="display:none">
                <i class="fa-solid fa-circle-notch spin" style="color:var(--sub);font-size:0.9rem"></i>
                <span class="text-xs ml-2" style="color:var(--sub)">verificare cheie...</span>
            </div>
        </div>
    </div>

    <!-- ══════════════════════════════════
         SCREEN: STREAM
         Only unlocked after STREAM_AUTH_OK from server.
         Camera access requested HERE, not before.
    ══════════════════════════════════ -->
    <div id="stream-screen" class="screen flex-1 flex-col safe-bottom">

        <div class="flex-1 flex flex-col gap-4 px-4 py-4 overflow-y-auto">
        <div class="stream-card" style="width:100%">

            <!-- video preview -->
            <video
                id="preview-video"
                autoplay muted playsinline
                webkit-playsinline
                x5-video-player-type="h5"
                x5-video-player-fullscreen="false"
                x5-video-orientation="portraint">
            </video>

            <!-- cam id + live badge row -->
            <div class="flex items-center justify-between">
                <span class="text-xs" style="color:var(--sub)">
                    cam&nbsp;<strong id="cam-id-display" style="color:var(--main)">—</strong>
                </span>
                <div class="live-badge" id="live-badge">
                    <div class="live-dot"></div> live
                </div>
            </div>

            <div class="divider"></div>

            <!-- quality selector -->
            <div>
                <label class="field-label">calitate video</label>
                <div class="q-grid">
                    <button class="q-btn active" onclick="setQuality('hd',this)" id="q-hd">720p</button>
                    <button class="q-btn"        onclick="setQuality('fhd',this)">1080p</button>
                    <button class="q-btn"        onclick="setQuality('4k',this)">4K</button>
                </div>
            </div>

            <!-- camera controls -->
            <div class="ctrl-grid">
                <button class="btn" id="flip-btn" onclick="flipCamera()">
                    <i class="fa-solid fa-rotate"></i> flip
                </button>
                <button class="btn btn-primary" id="start-btn" onclick="startStream()">
                    <i class="fa-solid fa-circle"></i> start live
                </button>
            </div>

            <!-- STOP button — always full width, very visible when live -->
            <button class="btn btn-danger" id="stop-btn"
                    onclick="stopStream()" style="display:none; width:100%; font-size:1rem; min-height:52px;">
                <i class="fa-solid fa-square"></i> oprește stream
            </button>

            <!-- status log -->
            <div class="status-log" id="status-log">pregătit · cameră inițializată</div>

            <div class="divider"></div>

        </div><!-- /stream-card -->
        </div><!-- /overflow wrapper -->
    </div>

    <!-- toast for errors -->
    <div class="toast" id="toast"></div>

    <script src="../js/stream.js"></script>

</body>
</html>
