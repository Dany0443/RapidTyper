<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Stream</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/stream.css">
    <style>
        /* ── Phone-first overrides ── */
        body { background: var(--bg); }

        /* Connecting */
        #connecting-screen { flex-direction: column; gap: 1.2rem; padding-top: env(safe-area-inset-top); }

        /* Auth screen — centered card */
        #auth-screen { padding: 1.5rem; padding-top: calc(env(safe-area-inset-top) + 1.5rem); }
        .auth-card { width: 100%; max-width: 400px; margin: 0 auto; }
        .auth-icon { width: 64px; height: 64px; border-radius: 50%; background: rgba(226,183,20,0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }

        /* Stream screen */
        #stream-screen { padding: 0; padding-bottom: env(safe-area-inset-bottom); }
        .stream-inner { display: flex; flex-direction: column; height: 100%; gap: 0; }

        /* Video fills most of the screen */
        .video-block { position: relative; width: 100%; background: #000; flex-shrink: 0; }
        #preview-video { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; border-radius: 0; border: none; }

        /* Video overlays */
        .video-overlays { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }
        .vid-live-badge { position: absolute; top: 0.75rem; left: 0.75rem; display: none; align-items: center; gap: 5px; background: rgba(202,71,84,0.92); color: #fff; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; padding: 4px 10px; border-radius: 4px; pointer-events: none; }
        .vid-live-badge.active { display: flex; }
        .vid-live-dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; animation: blink 1.2s ease-in-out infinite; }
        .vid-cam-id { position: absolute; top: 0.75rem; right: 0.75rem; font-size: 0.62rem; background: rgba(0,0,0,0.55); color: var(--main); padding: 3px 8px; border-radius: 4px; font-weight: 700; }
        .vid-quality-badge { position: absolute; bottom: 0.75rem; right: 0.75rem; font-size: 0.6rem; background: rgba(0,0,0,0.55); color: var(--sub); padding: 2px 6px; border-radius: 3px; }

        /* Controls panel below video */
        .controls-panel { flex: 1; overflow-y: auto; padding: 1rem 1rem; display: flex; flex-direction: column; gap: 0.85rem; }

        /* Big action button — thumb-friendly, full width */
        .big-action-btn { width: 100%; min-height: 56px; border-radius: 12px; font-size: 1rem; font-weight: 700; letter-spacing: 0.05em; display: flex; align-items: center; justify-content: center; gap: 0.6rem; border: 2px solid; cursor: pointer; transition: all 0.15s; touch-action: manipulation; font-family: 'Roboto Mono', monospace; }
        .big-start { color: var(--main); border-color: var(--main); background: transparent; }
        .big-start:hover, .big-start:active { background: var(--main); color: var(--bg); }
        .big-stop { color: #fff; border-color: var(--error); background: var(--error); }
        .big-stop:active { opacity: 0.8; }

        /* Secondary row: flip + quality */
        .secondary-row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0.5rem; }
        .q-pill { min-height: 44px; border-radius: 8px; background: rgba(255,255,255,0.04); border: 1.5px solid transparent; color: var(--sub); font: 700 0.75rem 'Roboto Mono', monospace; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: manipulation; transition: all 0.15s; }
        .q-pill.active { border-color: var(--main); color: var(--main); background: rgba(226,183,20,0.07); }
        .q-pill:active { opacity: 0.7; }

        /* Status log */
        .log-row { display: flex; align-items: center; gap: 0.5rem; }
        .log-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sub); flex-shrink: 0; }
        .log-dot.live { background: var(--error); box-shadow: 0 0 6px var(--error); animation: blink 1.2s ease-in-out infinite; }
        .log-text { font-size: 0.68rem; color: var(--sub); }

        /* Divider */
        .slim-div { height: 1px; background: rgba(255,255,255,0.05); }

        /* Logout link */
        .logout-link { font-size: 0.62rem; color: var(--sub); background: none; border: none; font-family: 'Roboto Mono', monospace; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; touch-action: manipulation; padding: 0.25rem 0; opacity: 0.6; }
        .logout-link:active { opacity: 1; }

        @media (min-width: 540px) {
            #stream-screen { display: flex; align-items: flex-start; justify-content: center; padding: 1.5rem; }
            .stream-inner { max-width: 440px; width: 100%; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); background: var(--panel); }
            #preview-video { border-radius: 0; }
        }
    </style>
</head>

<body class="safe-top">

    <!-- ── HEADER ── -->
    <header style="padding: calc(env(safe-area-inset-top) + 0.75rem) 1.25rem 0.75rem; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.05)">
        <div style="display:flex;align-items:center;gap:0.6rem">
            <i class="fa-solid fa-video" style="color:var(--main);font-size:1.1rem"></i>
            <span style="font-weight:700;font-size:1rem">stream</span>
        </div>
        <div style="display:flex;align-items:center;gap:0.6rem;font-size:0.72rem;color:var(--sub)">
            <div id="status-dot" class="status-indicator status-red"></div>
            <span id="status-text">disconnected</span>
        </div>
    </header>

    <!-- ── CONNECTING ── -->
    <div id="connecting-screen" class="screen active flex-1 items-center justify-center text-center p-8">
        <div>
            <div style="width:60px;height:60px;border-radius:50%;background:rgba(226,183,20,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem">
                <i class="fa-solid fa-circle-notch spin" style="color:var(--main);font-size:1.5rem"></i>
            </div>
            <p style="font-weight:700;margin-bottom:0.35rem">Se conectează...</p>
            <p style="font-size:0.75rem;color:var(--sub)">Se stabilește conexiunea</p>
        </div>
    </div>

    <!-- ── AUTH ── -->
    <div id="auth-screen" class="screen flex-1 flex items-center justify-center">
        <div class="auth-card">
            <div class="text-center" style="margin-bottom:2rem">
                <div class="auth-icon">
                    <i class="fa-solid fa-lock" style="color:var(--main);font-size:1.4rem"></i>
                </div>
                <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:0.3rem">Acces Cameră</h2>
                <p style="font-size:0.75rem;color:var(--sub)">Introdu cheia de acces pentru stream</p>
            </div>

            <div style="margin-bottom:1rem">
                <label class="field-label" for="stream-key">cheie de acces</label>
                <div style="position:relative">
                    <div style="position:absolute; left:0; top:0; bottom:0; padding-left:1rem; display:flex; align-items:center; pointer-events:none;">
                        <i class="fa-solid fa-key" style="color:var(--sub)"></i>
                    </div>
                </div>

                    <input type="password" id="stream-key" class="field-input"
                        style="padding-left:3rem;text-align:left;letter-spacing:0.12em"
                        placeholder="••••••••" autocomplete="current-password"
                        onkeydown="if(event.key==='Enter') submitAuth()">
                </div>
                <p id="auth-error" style="font-size:0.72rem;color:var(--error);margin-top:0.4rem;display:none">
                    Cheie incorectă. Încearcă din nou.
                </p>
            </div>

            <button class="btn btn-primary" style="width:100%;min-height:52px;font-size:0.9rem" onclick="submitAuth()" id="auth-btn">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Conectare
            </button>

            <div id="auth-waiting" style="text-align:center;margin-top:1rem;display:none">
                <i class="fa-solid fa-circle-notch spin" style="color:var(--sub);font-size:0.9rem"></i>
                <span style="font-size:0.72rem;color:var(--sub);margin-left:0.4rem">verificare cheie...</span>
            </div>
        </div>
    </div>

    <!-- ── STREAM ── -->
    <div id="stream-screen" class="screen flex-1">
        <div class="stream-inner">

            <!-- Video preview with overlays -->
            <div class="video-block">
                <video id="preview-video" autoplay muted playsinline webkit-playsinline></video>
                <div class="video-overlays">
                    <div class="vid-live-badge" id="live-badge">
                        <div class="vid-live-dot"></div> LIVE
                    </div>
                    <div class="vid-cam-id" id="cam-id-display">cam —</div>
                    <div class="vid-quality-badge" id="quality-badge">720p</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-panel">

                <!-- Big start/stop button -->
                <button class="big-action-btn big-start" id="start-btn" onclick="startStream()">
                    <i class="fa-solid fa-circle"></i> Start Live
                </button>
                <button class="big-action-btn big-stop" id="stop-btn" onclick="stopStream()" style="display:none">
                    <i class="fa-solid fa-square"></i> Oprește Stream
                </button>

                <div class="slim-div"></div>

                <!-- Secondary controls: flip + quality pills -->
                <div class="secondary-row">
                    <button class="q-pill" onclick="flipCamera()" title="flip camera">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                    <button class="q-pill active" id="q-hd"  onclick="setQuality('hd',this)">720p</button>
                    <button class="q-pill"         id="q-fhd" onclick="setQuality('fhd',this)">1080p</button>
                    <button class="q-pill"         id="q-4k"  onclick="setQuality('4k',this)">4K</button>
                </div>

                <!-- Status log -->
                <div class="log-row">
                    <div class="log-dot" id="log-dot"></div>
                    <span class="log-text" id="status-log">pregătit · cameră inițializată</span>
                </div>

                <div class="slim-div"></div>

                <!-- Logout -->
                <button class="logout-link" onclick="logoutStream()">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    schimbă camera / logout
                </button>

            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- school-server.js redirects http://.../stream → https://...:8443/stream
         This inline script is a fallback for edge cases only. -->
    <script>
    (function(){
        if(location.protocol==='http:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
            location.replace('https://'+location.hostname+':8443'+location.pathname+location.search);
        }
    })();
    </script>
        <script src="../js/stream.js"></script>
</body>
</html>
