<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Stream</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/stream.css">
    <script src="/config.js"></script>
</head>

<body>

    <header class="app-header">
        <div class="app-brand">
            <i class="fa-solid fa-video" style="color:var(--main);"></i>
            <span>stream</span>
        </div>
        <div class="app-status">
            <div id="status-dot" class="status-indicator status-red"></div>
            <span id="status-text">disconnected</span>
        </div>
    </header>

    <div id="connecting-screen" class="screen active">
        <div class="center-wrap">
            <div style="text-align: center;">
                <div class="auth-icon-wrap" style="margin-bottom: 1rem;">
                    <i class="fa-solid fa-circle-notch spin" style="color:var(--main);font-size:1.75rem"></i>
                </div>
                <p style="font-weight:700; font-size: 1.1rem; margin-bottom:0.35rem; color: var(--text);">Se conectează...</p>
                <p style="font-size:0.8rem;color:var(--sub)">Se stabilește conexiunea</p>
            </div>
        </div>
    </div>

    <div id="auth-screen" class="screen">
        <div class="center-wrap">
            <div class="auth-card">
                <div class="auth-icon-wrap">
                    <i class="fa-solid fa-lock" style="color:var(--main);font-size:1.75rem"></i>
                </div>
                <h2 style="font-size:1.4rem;font-weight:700;margin-bottom:0.4rem;color: var(--text);">Acces Cameră</h2>
                <p style="font-size:0.8rem;color:var(--sub);margin-bottom: 2rem;">Introdu cheia de acces pentru stream</p>

                <div class="input-group">
                    <label class="field-label" for="stream-key">Cheie de acces</label>
                    <i class="fa-solid fa-key input-icon"></i>
                    <input type="password" id="stream-key" class="field-input"
                           placeholder="••••••••" autocomplete="current-password"
                           onkeydown="if(event.key==='Enter') submitAuth()">
                </div>

                <p id="auth-error" style="font-size:0.75rem;color:var(--error);margin: -1rem 0 1rem;display:none;text-align:left;">
                    Cheie incorectă. Încearcă din nou.
                </p>

                <button class="btn btn-primary" onclick="submitAuth()" id="auth-btn">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Conectare
                </button>

                <div id="auth-waiting" style="text-align:center;margin-top:1.25rem;display:none">
                    <i class="fa-solid fa-circle-notch spin" style="color:var(--sub);font-size:0.9rem"></i>
                    <span style="font-size:0.75rem;color:var(--sub);margin-left:0.5rem">verificare cheie...</span>
                </div>
            </div>
        </div>
    </div>

    <div id="stream-screen" class="screen">
        <div class="stream-container">
            
            <div class="video-wrapper">
                <video id="preview-video" autoplay muted playsinline webkit-playsinline></video>
                
                <div class="vid-live-badge" id="live-badge">
                    <div class="vid-live-dot"></div> LIVE
                </div>
                <div class="vid-cam-id" id="cam-id-display">cam —</div>
                <div class="vid-quality-badge" id="quality-badge">720p</div>
            </div>

            <div class="controls-panel">
                
                <button class="btn btn-outline-main" id="start-btn" onclick="startStream()">
                    <i class="fa-solid fa-circle"></i> Start Live
                </button>
                <button class="btn btn-danger" id="stop-btn" onclick="stopStream()" style="display:none">
                    <i class="fa-solid fa-square"></i> Oprește Stream
                </button>

                <div class="secondary-controls">
                    <button class="flip-btn" id="flip-btn" onclick="flipCamera()" title="Schimbă camera">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                    
                    <div class="quality-pills">
                        <button class="q-pill active" id="q-hd" onclick="setQuality('hd',this)">720p</button>
                        <button class="q-pill" id="q-fhd" onclick="setQuality('fhd',this)">1080p</button>
                        <button class="q-pill" id="q-4k" onclick="setQuality('4k',this)">4K</button>
                    </div>
                </div>

                <div class="status-log-wrap">
                    <div class="log-dot" id="log-dot"></div>
                    <span style="font-size: 0.75rem; color: var(--text);" id="status-log">pregătit · cameră inițializată</span>
                </div>

                <div style="margin-top: auto; text-align: center;">
                    <button class="logout-link" onclick="logoutStream()">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        Schimbă camera / Logout
                    </button>
                </div>
                
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (function(){
        if(location.protocol==='http:' && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
            location.replace('https://'+location.hostname+':8443'+location.pathname+location.search);
        }
    })();
    </script>
    <script src="../js/stream.js"></script>
</body>
</html>
